[workspace]
resolver = "2"
members = ["crates/opencue-core", "crates/opencue-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.2"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/Lautaro005/opencue"
rust-version = "1.85"

[workspace.dependencies]
opencue-core = { path = "crates/opencue-core" }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
