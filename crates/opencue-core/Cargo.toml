[package]
name = "opencue-core"
description = "Core runtime for OpenCue: agents, providers, memory, MCP, web access"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip"] }
eventsource-stream = "0.2"
rmcp = { version = "3", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
keyring = "4"
directories = "6"
scraper = "0.27"
htmd = "0.5"
url = "2"
regex = "1"
which = "8"
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
