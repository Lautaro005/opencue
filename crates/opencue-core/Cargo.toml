[package]
name = "opencue-core"
description = "Core runtime for OpenCue: agents, providers, memory, MCP, web access"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip", "multipart", "query"] }
eventsource-stream = "0.2"
rmcp = { version = "3", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
keyring = "4"
directories = "6"
scraper = "0.27"
htmd = "0.5"
url = "2"
regex = "1"
which = "8"
tokio-util = "0.7"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
mail-parser = "0.11.9"
tokio-rustls = "0.26.6"
webpki-roots = "1.0.9"
croner = "4.0.1"
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3"
