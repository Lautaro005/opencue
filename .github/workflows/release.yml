name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb,rpm
          - name: windows-x64
            os: windows-latest
            args: --bundles msi,nsis
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal macOS build needs both Apple targets.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles that the in-app updater verifies (not OS code signing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # tauri-action substitutes __VERSION__ with the app version from tauri.conf.json.
          tagName: v__VERSION__
          releaseName: OpenCue v__VERSION__
          releaseBody: |
            Install from a terminal:

            - macOS / Linux: `curl -fsSL https://lautaro005.github.io/opencue/install.sh | sh`
            - Windows (PowerShell): `irm https://lautaro005.github.io/opencue/install.ps1 | iex`

            Then run `opencue`. Or download an installer below. What's new: https://lautaro005.github.io/opencue/changelog/
          releaseDraft: false
          prerelease: false
          # latest.json for the in-app updater; Windows updates through the NSIS installer.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  cli:
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: opencue-cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: opencue-cli.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: opencue-cli
    runs-on: ${{ matrix.os }}
    needs: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --release -p opencue-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cd dist && 7z a ../opencue-cli-${{ matrix.target }}.zip ${{ matrix.bin }} >/dev/null 2>&1 || zip ../opencue-cli-${{ matrix.target }}.zip ${{ matrix.bin }}
      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: opencue-cli-${{ matrix.target }}.zip
